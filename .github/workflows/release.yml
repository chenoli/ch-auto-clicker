name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  release:
    name: Build and publish
    needs: checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Tag matches the app version
        shell: bash
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match version $version in tauri.conf.json"; exit 1
          fi
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: CH Auto Clicker ${{ github.ref_name }}
          releaseBody: |
            Install with `ch-auto-clicker-setup.exe` (per user, no admin rights needed). It is the same file as
            `CH.Auto.Clicker_*_x64-setup.exe`; the first name always points to the latest release.

            **Note:** this build is not code-signed yet. Windows shows "Unknown publisher":
            click "More info" → "Run anyway". With Smart App Control turned on, Windows 11
            blocks the app until it is signed.

            Microsoft Defender may flag the unsigned app as a false positive (for example
            `Trojan:Win32/Bearfoos.B!ml`). To restore it: Windows Security → Virus & threat protection →
            Protection history → select the detection → Actions → Allow on device. "Start with Windows"
            returns in v0.9.0, once the app is signed.

            The MSI packages install for all users and do not delete your profiles on uninstall;
            remove `%APPDATA%\Chenoli\CH Auto Clicker` by hand if you want them gone.

            Anti-cheat systems detect automated input. Do not use it where the terms of service forbid automation.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
      - name: Upload the installer under a stable name and publish
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          installers=(target/release/bundle/nsis/*_x64-setup.exe)
          if [ "${#installers[@]}" -ne 1 ]; then
            echo "Expected one NSIS installer, found ${#installers[@]}"; exit 1
          fi
          cp "${installers[0]}" ch-auto-clicker-setup.exe
          gh release upload "$GITHUB_REF_NAME" ch-auto-clicker-setup.exe --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
      - name: Create a token for the landing repository
        id: landing-token
        if: vars.LANDING_APP_CLIENT_ID != ''
        continue-on-error: true
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.LANDING_APP_CLIENT_ID }}
          private-key: ${{ secrets.LANDING_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - name: Notify the landing page
        shell: bash
        env:
          GH_TOKEN: ${{ steps.landing-token.outputs.token }}
          LANDING_REPO: ${{ vars.LANDING_REPO }}
        run: |
          if [ -z "$GH_TOKEN" ] || [ -z "$LANDING_REPO" ]; then
            echo "::warning::The landing GitHub App or LANDING_REPO is not set up; the landing page picks up the release within an hour"
            exit 0
          fi
          gh api "repos/$LANDING_REPO/dispatches" -f event_type=app-release
