name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (format, lint, types, tests + coverage, build, visual)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generated tokens up to date
        run: pnpm tokens:check
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Dependency audit
        run: pnpm audit --prod
      - name: Visual parity
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm test:visual
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results

  rust:
    name: Rust (fmt, clippy, tests + coverage, bindings)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Rust coverage (80% minimum)
        run: cargo llvm-cov --workspace --exclude ch-clicker --exclude jitter-bench --fail-under-lines 80 --fail-under-functions 80
      - name: TypeScript bindings up to date
        shell: bash
        run: git diff --exit-code -- ui/src/ipc/bindings.ts
      - name: ch-core has no Windows dependency
        shell: bash
        run: |
          if cargo tree -p ch-core -e normal | grep -q windows; then
            echo "ch-core must not depend on the windows crate (ARCHITECTURE §2)"; exit 1
          fi
      - uses: taiki-e/install-action@cargo-audit
      - run: cargo audit
