[package]
name = "ch-core"
description = "CH. Clicker domain: models, movement patterns, scheduler and state machine. No Windows dependency."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Exposes the recording input backend to other crates' tests.
test-util = []
# Derives specta::Type so the app can export these types to TypeScript.
specta = ["dep:specta"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
specta = { workspace = true, optional = true }
thiserror.workspace = true

[dev-dependencies]
# Integration tests use the fakes behind `test-util`.
ch-core = { path = ".", features = ["test-util"] }
proptest = "1.11"

[lints]
workspace = true
