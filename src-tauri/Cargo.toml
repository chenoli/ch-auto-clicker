[package]
name = "ch-clicker"
description = "CH. Clicker, a native Windows auto clicker (Chenoli Labs)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
publish.workspace = true
default-run = "ch-clicker"

[lib]
name = "ch_clicker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
ch-core.workspace = true
ch-engine.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = "0.0.12"
tauri = { version = "2.12", features = [] }
tauri-plugin-log = "2.10"
tauri-plugin-single-instance = "2.5"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }

[target.'cfg(windows)'.dependencies]
ch-win.workspace = true

[lints]
workspace = true
